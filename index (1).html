<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Физика ЕГЭ — справочник формул</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #0b1020;
        --card: #141b2d;
        --card2: #1a2338;
        --text: #f4f7ff;
        --muted: #9ba8c2;
        --accent: #5b8cff;
        --accent2: #7c5cff;
        --border: rgba(255,255,255,0.08);
        --green: #42d392;
        --orange: #ffad4d;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at top left, rgba(91,140,255,.18), transparent 30%),
            radial-gradient(circle at top right, rgba(124,92,255,.15), transparent 25%),
            var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    header {
        padding: 50px 20px 35px;
        text-align: center;
    }

    header h1 {
        font-size: clamp(32px, 6vw, 62px);
        margin-bottom: 15px;
        background: linear-gradient(90deg, #6ea0ff, #9c7cff);
        -webkit-background-clip: text;
        color: transparent;
    }

    header p {
        color: var(--muted);
        max-width: 760px;
        margin: auto;
        font-size: 18px;
        line-height: 1.6;
    }

    .author {
        margin-top: 16px;
        color: #cbd5ff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .2px;
    }

    .container {
        width: min(1400px, 94%);
        margin: auto;
    }

    .search-box {
        position: sticky;
        top: 10px;
        z-index: 20;
        margin-bottom: 25px;
    }

    .search-box input {
        width: 100%;
        padding: 20px 24px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: rgba(20,27,45,.92);
        backdrop-filter: blur(15px);
        color: white;
        font-size: 18px;
        outline: none;
        box-shadow: 0 10px 40px rgba(0,0,0,.2);
    }

    .search-box input:focus {
        border-color: var(--accent);
    }

    .categories {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 30px;
    }

    .category-btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--muted);
        padding: 12px 17px;
        border-radius: 12px;
        cursor: pointer;
        transition: .2s;
        font-size: 14px;
    }

    .category-btn:hover {
        color: white;
        transform: translateY(-2px);
        border-color: var(--accent);
    }

    .category-btn.active {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
        border-color: transparent;
    }

    .stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        color: var(--muted);
    }

    .formulas-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 18px;
        padding-bottom: 50px;
    }

    .formula-card {
        background: linear-gradient(145deg, var(--card), var(--card2));
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 23px;
        transition: .25s;
        overflow: hidden;
    }

    .formula-card:hover {
        transform: translateY(-5px);
        border-color: rgba(91,140,255,.45);
        box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    .formula-card h2 {
        font-size: 19px;
        margin-bottom: 10px;
    }

    .tag {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 8px;
        background: rgba(91,140,255,.12);
        color: #79a1ff;
        font-size: 12px;
        margin-bottom: 14px;
    }

    .formula {
        background: #080d19;
        border-radius: 13px;
        padding: 18px;
        text-align: center;
        font-size: 25px;
        font-weight: bold;
        color: #fff;
        margin-bottom: 16px;
        overflow-x: auto;
    }

    .purpose {
        color: #dce4f7;
        line-height: 1.5;
        margin-bottom: 15px;
        font-size: 14px;
    }

    .purpose strong {
        color: var(--green);
    }

    .variables {
        border-top: 1px solid var(--border);
        padding-top: 14px;
    }

    .variables-title {
        color: var(--orange);
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .variable {
        color: var(--muted);
        line-height: 1.6;
        font-size: 13px;
    }

    .variable b {
        color: white;
    }

    .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--muted);
        grid-column: 1 / -1;
    }

    footer {
        text-align: center;
        color: var(--muted);
        padding: 30px;
        border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
        header {
            padding-top: 30px;
        }

        .formulas-grid {
            grid-template-columns: 1fr;
        }

        .formula-card {
            padding: 18px;
        }

        .formula {
            font-size: 21px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Физика ЕГЭ</h1>
    <p>
        Интерактивный справочник формул.
        Выбери раздел или воспользуйся поиском,
        чтобы быстро найти нужную формулу.

    <div class="author">Автор: Исмаилов Илкин</div>

    <section class="formulas-grid" id="formulaList"></section>

</main>

<footer>
    Справочник формул по физике • ЕГЭ
</footer>

/* =========================================================
   ИНТЕРФЕЙС
========================================================= */

const formulaList = document.getElementById("formulaList");
const categories = document.getElementById("categories");
const search = document.getElementById("search");
const counter = document.getElementById("counter");

let currentCategory = "Все";

const categoryList = [
    "Все",
    "Механика",
    "Молекулярная физика",
    "Термодинамика",
    "Электродинамика",
    "Колебания и волны",
    "Оптика",
    "Квантовая физика",
    "СТО",
    "Основные величины"
];

function createCategoryButtons() {
    categories.innerHTML = "";

    categoryList.forEach(category => {
        const button = document.createElement("button");

        button.className = "category-btn";
        if (category === currentCategory) {
            button.classList.add("active");
        }

        button.textContent = category;

        button.onclick = () => {
            currentCategory = category;
            createCategoryButtons();
            renderFormulas();
        };

        categories.appendChild(button);
    });
}


function renderFormulas() {

    const query = search.value.toLowerCase().trim();

    let result = formulas.filter(item => {

        const categoryMatch =
            currentCategory === "Все" ||
            item.category === currentCategory;

        const searchText = (
            item.title + " " +
            item.formula + " " +
            item.purpose + " " +
            item.category + " " +
            item.variables.map(v => v.join(" ")).join(" ")
        ).toLowerCase();

        const searchMatch = searchText.includes(query);

        return categoryMatch && searchMatch;
    });

    counter.textContent =
        `Найдено формул: ${result.length}`;

    formulaList.innerHTML = "";

    if (result.length === 0) {
        formulaList.innerHTML = `
            <div class="empty">
                <h2>Ничего не найдено 😔</h2>
                <p>Попробуй изменить запрос или выбрать другой раздел.</p>
            </div>
        `;
        return;
    }

    result.forEach(item => {

        const card = document.createElement("article");
        card.className = "formula-card";

        let variablesHTML = "";

        item.variables.forEach(variable => {
            variablesHTML += `
                <div class="variable">
                    <b>${variable[0]}</b> — ${variable[1]}
                </div>
            `;
        });

        card.innerHTML = `
            <span class="tag">${item.category}</span>

            <h2>${item.title}</h2>

            <div class="formula">
                ${item.formula}
            </div>

            <div class="purpose">
                <strong>Назначение:</strong><br>
                ${item.purpose}
            </div>

            <div class="variables">
                <div class="variables-title">
                    Обозначения:
                </div>

                ${variablesHTML}
            </div>
        `;

        formulaList.appendChild(card);
    });
}


search.addEventListener("input", renderFormulas);

createCategoryButtons();
renderFormulas();

</script>
